name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 22
        script: |
          cd ~/chordkeeper/
          git pull origin main
          
          # Parar containers
          docker compose -f docker-compose-production.yml stop
          
          # Remover volumes antigos do frontend para forçar reinstalação
          docker compose -f docker-compose-production.yml rm -f frontend
          docker volume prune -f
          
          # Build e restart dos containers
          docker compose -f docker-compose-production.yml build --no-cache
          docker compose -f docker-compose-production.yml up -d
          
          # Aguardar containers iniciarem
          sleep 10
          
          # Executar migrations do Rails
          docker compose -f docker-compose-production.yml exec -T web rails db:migrate
          
          # Limpar recursos não utilizados
          docker system prune -f
