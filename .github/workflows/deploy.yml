name: Deploy to VPS

on:
  push:
    branches: [ main ]  # ou master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Pull git changes and deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 22
        script: |
          cd ~/chordkeeper/
          git pull origin main

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 22
        script: |
          cd ~/chordkeeper/

          docker compose -f docker-compose-production.yml stop
          docker compose -f docker-compose-production.yml up --build -d
          docker compose exec -T web rails db:migrate
          docker compose exec web rake assets:precompile

          cd ~/chordkeeper/frontend

          docker compose exec -T frontend npm ci
          docker compose exec -T frontend npm run build

          docker system prune -f

