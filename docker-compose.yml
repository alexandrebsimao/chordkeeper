version: '3'
networks:
  chordkeeper_net:
    driver: bridge

services:
  db:
    image: postgres:13.15-bullseye
    restart: always
    environment:
      POSTGRES_PASSWORD: chordkeeper
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    networks:
      - chordkeeper_net
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chordkeeper_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    stdin_open: true
    tty: true
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    env_file:
      - .env
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    networks:
      - chordkeeper_net
  sidekiq:
    build: .
    command: bundle exec sidekiq
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - chordkeeper_net
    volumes:
      - .:/myapp
  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - ./frontend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  redis_data:
