version: '3'
services:
  db:
    image: postgres:13.15-bullseye
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: chordkeeper
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    networks:
      - internal
  web:
    stdin_open: true
    tty: true # Enables debugging capabilities when attached to this container.
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-chordkeeper}@db:5432/${DB_NAME:-chordkeeper}
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myapp.rule=Host(`chordkeeper.innapses.com`)"
      - "traefik.http.routers.myapp.entrypoints=websecure"
      - "traefik.http.routers.myapp.tls.certresolver=letsencrypt"
      
      # CRÍTICO: Force HTTP no backend (sem S)
      - "traefik.http.services.myapp.loadbalancer.server.port=3000"
      - "traefik.http.services.myapp.loadbalancer.server.scheme=http"
      
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
  internal:
    driver: bridge