version: '3'
services:
  db:
    image: postgres:13.15-bullseye
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: chordkeeper
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    networks:
      - internal
  web:
    stdin_open: true
    tty: true # Enables debugging capabilities when attached to this container.
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-chordkeeper}@db:5432/${DB_NAME:-chordkeeper}
      - DOMAIN_NAME=chordkeeper.innapses.com
    volumes:
      - .:/myapp
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chordkeeper-api.entrypoints=https"
      - "traefik.http.routers.chordkeeper-api.rule=Host(`api-chordkeeper.innapses.com`)"
      - "traefik.http.routers.chordkeeper-api.tls=true"
      - "traefik.http.routers.chordkeeper-api.tls.certresolver=cloudflare"
      - "traefik.http.services.chordkeeper-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: frontend
    restart: always
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://api-chordkeeper.innapses.com
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chordkeeper-app.entrypoints=https"
      - "traefik.http.routers.chordkeeper-app.rule=Host(`chordkeeper.innapses.com`)"
      - "traefik.http.routers.chordkeeper-app.tls=true"
      - "traefik.http.routers.chordkeeper-app.tls.certresolver=cloudflare"
      - "traefik.http.services.chordkeeper-app.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
  internal:
    driver: bridge